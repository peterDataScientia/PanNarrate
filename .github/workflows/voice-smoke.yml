name: Free narration browser smoke
on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/voice-smoke.yml'
      - 'scripts/voice-smoke.mjs'
      - 'scripts/page-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install chromium --with-deps
      - name: Start same-commit web application
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/pannarrate-vite.log 2>&1 &
          for i in $(seq 1 25); do
            if curl --fail -s http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pannarrate-vite.log
          exit 1
      - name: Check free voice is default and Puter requires explicit opt-in
        run: BASE_URL=http://127.0.0.1:4173 node scripts/voice-smoke.mjs
      - name: Check free full PDF page narration and navigation
        run: BASE_URL=http://127.0.0.1:4173 node scripts/page-smoke.mjs
