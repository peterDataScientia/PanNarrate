name: Hosted voice browser smoke
on:
  push:
    paths:
      - '.github/workflows/voice-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install chromium --with-deps
      - name: Check hosted neural voice live
        run: node scripts/voice-smoke.mjs
